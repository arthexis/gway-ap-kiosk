name: AP and kiosk tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python sources
        run: python -m compileall -q kiosk/bin/gway-kiosk-status scripts/ap/kiosk-ap tests
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Run AP and kiosk regression tests
        run: python -m pytest -q --durations=0 --durations-min=0.001 tests/test_ap_reveal.py tests/test_ap_wrappers.py tests/test_kiosk_ap_reset.py tests/test_kiosk_independence.py tests/test_kiosk_ap_discovery.py tests/test_ap_portal_server.py tests/test_kiosk_ap_security.py
      - name: Shell syntax
        run: bash -n deploy.sh
