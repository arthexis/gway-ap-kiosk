---
- name: Install standalone AP kiosk on a fresh appliance
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    kiosk_ci_mode: false
    kiosk_user: arthe
    kiosk_home: /home/arthe
    project_root: "{{ playbook_dir }}/../.."
  tasks:
    - name: Require existing kiosk operator account
      ansible.builtin.getent:
        database: passwd
        key: "{{ kiosk_user }}"

    - name: Prepare kiosk executable directories
      become: true
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - /usr/local/bin
        - /usr/local/sbin
        - /usr/local/libexec

    - name: Keep shared operator CLI directory writable
      become: true
      ansible.builtin.file:
        path: "{{ kiosk_home }}/.local/bin"
        state: directory
        owner: "{{ kiosk_user }}"
        group: "{{ kiosk_user }}"
        mode: "0755"

    - name: Install kiosk and AP runtime executables
      become: true
      ansible.builtin.copy:
        src: "{{ project_root }}/{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: "0755"
      loop:
        - { src: kiosk/bin/gway-kiosk-status, dest: /usr/local/bin/gway-kiosk-status }
        - { src: kiosk/bin/kiosk-mode, dest: /usr/local/bin/kiosk-mode }
        - { src: kiosk/sbin/gway-hdmi-kiosk-session, dest: /usr/local/sbin/gway-hdmi-kiosk-session }
        - { src: kiosk/sbin/gway-hdmi-kiosk-layout, dest: /usr/local/sbin/gway-hdmi-kiosk-layout }
        - { src: kiosk/libexec/gway-boot-stagger-until, dest: /usr/local/libexec/gway-boot-stagger-until }
        - { src: scripts/ap/kiosk-ap, dest: /usr/local/sbin/kiosk-ap }
      notify: Restart kiosk status

    - name: Install restricted AP rotation sudoers policy
      become: true
      ansible.builtin.copy:
        dest: /etc/sudoers.d/gway-kiosk-ap
        owner: root
        group: root
        mode: "0440"
        content: |
          {{ kiosk_user }} ALL=(root) NOPASSWD: /usr/local/sbin/kiosk-ap rotate
        validate: /usr/sbin/visudo -cf %s

    - name: Install kiosk systemd services
      become: true
      ansible.builtin.copy:
        src: "{{ project_root }}/kiosk/systemd/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - gway-kiosk-status.service
        - gway-hdmi-kiosk.service
        - gway-hdmi-kiosk-layout.service
      notify:
        - Reload systemd
        - Restart kiosk status

    - name: Prepare GWAY HDMI systemd drop-in directories
      become: true
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - gway-hdmi-kiosk.service.d
        - gway-hdmi-kiosk-layout.service.d

    - name: Install GWAY HDMI unit drop-ins
      become: true
      ansible.builtin.copy:
        src: "{{ project_root }}/kiosk/systemd/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - gway-hdmi-kiosk.service.d/98-boot-stagger-30s.conf
        - gway-hdmi-kiosk-layout.service.d/20-bastion-refresh-order.conf
        - gway-hdmi-kiosk-layout.service.d/98-boot-stagger-30s.conf
      notify: Reload systemd

    - name: Detect optional Bastion USB refresh service
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/systemd/system/bastion-usb-refresh.service
        - /usr/lib/systemd/system/bastion-usb-refresh.service
        - /lib/systemd/system/bastion-usb-refresh.service
      register: bastion_refresh_units

    - name: Prepare optional Bastion USB drop-in directory
      become: true
      ansible.builtin.file:
        path: /etc/systemd/system/bastion-usb-refresh.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"
      when: bastion_refresh_units.results | selectattr('stat.exists') | list | length > 0

    - name: Integrate with installed Bastion USB refresh service
      become: true
      ansible.builtin.copy:
        src: "{{ project_root }}/kiosk/systemd/bastion-usb-refresh.service.d/60-kiosk-layout.conf"
        dest: /etc/systemd/system/bastion-usb-refresh.service.d/60-kiosk-layout.conf
        owner: root
        group: root
        mode: "0644"
      when: bastion_refresh_units.results | selectattr('stat.exists') | list | length > 0
      notify: Reload systemd

    - name: Install default kiosk configuration only on fresh installation
      become: true
      ansible.builtin.copy:
        src: "{{ project_root }}/kiosk/defaults/{{ item.src }}"
        dest: "/etc/default/{{ item.dest }}"
        owner: root
        group: root
        mode: "0644"
        force: false
      loop:
        - { src: gway-hdmi-kiosk.example, dest: gway-hdmi-kiosk }
        - { src: gway-hdmi-kiosk-layout.example, dest: gway-hdmi-kiosk-layout }

    - name: Reload service manager before enabling kiosk status
      when: not kiosk_ci_mode | bool
      ansible.builtin.meta: flush_handlers

    - name: Enable and start standalone kiosk status
      when: not kiosk_ci_mode | bool
      become: true
      ansible.builtin.systemd_service:
        name: gway-kiosk-status.service
        enabled: true
        state: started

    - name: Check standalone kiosk HTTP response
      when: not kiosk_ci_mode | bool
      ansible.builtin.uri:
        url: http://127.0.0.1:8899/kiosk/status/data/
        return_content: false
        status_code: 200
      register: kiosk_health
      retries: 5
      delay: 2
      until: kiosk_health.status == 200

    - name: Ensure version evidence directory exists
      when: not kiosk_ci_mode | bool
      become: true
      ansible.builtin.file:
        path: /var/lib/gway-ap-kiosk
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Record verified installed kiosk revision after successful health check
      when: not kiosk_ci_mode | bool
      become: true
      ansible.builtin.copy:
        dest: /var/lib/gway-ap-kiosk/installed-revision
        content: "{{ lookup('pipe', 'git -C ' ~ project_root ~ ' rev-parse HEAD') | trim }}"
        owner: root
        group: root
        mode: "0644"

  handlers:
    - name: Reload systemd
      when: not kiosk_ci_mode | bool
      become: true
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Restart kiosk status
      when: not kiosk_ci_mode | bool
      become: true
      ansible.builtin.systemd_service:
        name: gway-kiosk-status.service
        state: restarted
