---
# Stages a supported portal runtime. Deliberately does NOT install/enable
# systemd or Nginx, migrate state, touch nftables or change active AP services.
- name: Stage GWAY AP portal candidate for reviewed existing-host migration
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    portal_project_root: "{{ playbook_dir }}/../.."
    portal_revision: "{{ lookup('pipe', 'git -C ' ~ portal_project_root ~ ' rev-parse HEAD') | trim }}"
    portal_operator_uid: "{{ lookup('pipe', 'id -u gwayap') | trim }}"
    portal_release_root: /opt/gway-ap-kiosk/portal/candidates
    portal_candidate_dir: "{{ portal_release_root }}/{{ portal_revision }}"
  tasks:
    - name: Require full Git revision
      ansible.builtin.assert:
        that:
          - portal_revision is match('^[0-9a-f]{40}$')
        fail_msg: "Candidate staging requires a full Git commit SHA"

    - name: Require pre-provisioned dedicated portal identity
      ansible.builtin.assert:
        that:
          - portal_operator_uid is match('^[1-9][0-9]*$')
        fail_msg: "Dedicated gwayap identity must be provisioned separately before staging"

    - name: Create root-owned candidate directories
      become: true
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
        follow: false
      loop:
        - "{{ portal_release_root }}"
        - "{{ portal_candidate_dir }}"
        - "{{ portal_candidate_dir }}/scripts"
        - "{{ portal_candidate_dir }}/config"
        - "{{ portal_candidate_dir }}/config/data"
        - "{{ portal_candidate_dir }}/config/data/ap_portal"

    - name: Stage Python portal and restricted broker modules
      become: true
      ansible.builtin.copy:
        src: "{{ portal_project_root }}/scripts/{{ item }}"
        dest: "{{ portal_candidate_dir }}/scripts/{{ item }}"
        owner: root
        group: root
        mode: "0755"
        force: false
      loop:
        - ap_portal_server.py
        - portal_firewall_coordinator.py
        - portal_nft_client.py
        - portal_nft_broker.py
        - portal_grant_intent.py
        - portal_cutover_contract.py
        - portal_attribution.py
        - portal_captive_policy.py
        - portal_authorization_reconcile.py

    - name: Stage portal assets without touching the live Nginx site
      become: true
      ansible.builtin.copy:
        src: "{{ portal_project_root }}/config/data/ap_portal/{{ item }}"
        dest: "{{ portal_candidate_dir }}/config/data/ap_portal/{{ item }}"
        owner: root
        group: root
        mode: "0644"
        force: false
      loop:
        - index.html
        - app.css
        - app.js

    - name: Stage service candidate, never install or start it
      become: true
      ansible.builtin.template:
        src: "{{ portal_project_root }}/ansible/templates/gway-ap-portal-candidate.service.j2"
        dest: "{{ portal_candidate_dir }}/gway-ap-portal.service"
        owner: root
        group: root
        mode: "0644"
        force: false

    - name: Stage restricted broker service candidate, never activate
      become: true
      ansible.builtin.template:
        src: "{{ portal_project_root }}/ansible/templates/gway-ap-nft-broker-candidate.service.j2"
        dest: "{{ portal_candidate_dir }}/gway-ap-nft-broker.service"
        owner: root
        group: root
        mode: "0644"
        force: false

    - name: Stage host-security reconciliation service, never install
      become: true
      ansible.builtin.template:
        src: "{{ portal_project_root }}/ansible/templates/gway-ap-host-security-reconcile-candidate.service.j2"
        dest: "{{ portal_candidate_dir }}/gway-ap-host-security-reconcile.service"
        owner: root
        group: root
        mode: "0644"
        force: false

    - name: Stage host-security restart hook, never install
      become: true
      ansible.builtin.copy:
        src: "{{ portal_project_root }}/ansible/templates/gway-ap-host-security-reconcile-dropin.conf"
        dest: "{{ portal_candidate_dir }}/90-gway-ap-reconcile.conf"
        owner: root
        group: root
        mode: "0644"
        force: false

    - name: Stage Nginx location candidate, never enable it
      become: true
      ansible.builtin.copy:
        src: "{{ portal_project_root }}/config/nginx/gway-ap-portal.location"
        dest: "{{ portal_candidate_dir }}/gway-ap-portal.location"
        owner: root
        group: root
        mode: "0644"
        force: false

    - name: Verify every staged file matches this revision without overwriting existing candidates
      ansible.builtin.command:
        argv:
          - cmp
          - -s
          - "{{ portal_project_root }}/{{ item }}"
          - "{{ portal_candidate_dir }}/{{ item }}"
      loop:
        - scripts/ap_portal_server.py
        - scripts/portal_firewall_coordinator.py
        - scripts/portal_nft_client.py
        - scripts/portal_nft_broker.py
        - scripts/portal_grant_intent.py
        - scripts/portal_cutover_contract.py
        - scripts/portal_attribution.py
        - scripts/portal_captive_policy.py
        - scripts/portal_authorization_reconcile.py
        - config/data/ap_portal/index.html
        - config/data/ap_portal/app.css
        - config/data/ap_portal/app.js
      changed_when: false
